<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マキちゃんのモンスターアドベンチャー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; padding:0; background:#12131a; color:#fff;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic UI","MS Gothic","Courier New",monospace; }
  #app { max-width:560px; margin:0 auto; padding:8px; }
  h1 { font-size:15px; text-align:center; margin:6px 0; letter-spacing:1px; color:#ffe27a;
    text-shadow:1px 1px 0 #7a4b00; }
  .screen { position:relative; width:100%; aspect-ratio:17/13; background:#000;
    border:4px solid #2b2f42; border-radius:8px; overflow:hidden; }
  canvas#field { width:100%; height:100%; display:block; image-rendering:pixelated;
    image-rendering:crisp-edges; background:#4e9c4a; }

  .overlay { position:absolute; inset:0; display:none; }
  .overlay.on { display:block; }

  /* title */
  #titleScr { background:linear-gradient(160deg,#213a5e,#3a2150); text-align:center;
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  #titleScr.on { display:flex; }
  #titleScr img { width:34%; image-rendering:auto; filter:drop-shadow(0 4px 8px #0008); }
  #titleScr h2 { font-size:18px; color:#fff; margin:8px 0 2px; text-shadow:2px 2px 0 #0006; }
  #titleScr p { font-size:11px; color:#cfe; margin:2px 0; line-height:1.6; }

  /* battle */
  #battleScr { background:linear-gradient(#8ecae6 55%,#a7d08c 55%); }
  .mon-slot { position:absolute; }
  #enemySlot { top:7%; right:5%; text-align:center; }
  #playerSlot { bottom:32%; left:5%; text-align:center; }
  #enemyImg { max-height:120px; max-width:44%; image-rendering:auto; }
  #playerImg { max-height:135px; max-width:48%; image-rendering:auto; transform:scaleX(-1); }
  .info-box { position:absolute; background:#fff; color:#222; border:3px solid #444;
    border-radius:8px; padding:5px 8px; box-shadow:2px 2px 0 #0004; min-width:44%; }
  #enemyInfo { top:6%; left:5%; }
  #playerInfo { top:43%; right:5%; }
  .info-name { font-size:12px; font-weight:bold; display:flex; justify-content:space-between; gap:6px;}
  .info-lv { font-size:10px; color:#555; }
  .ball-row { font-size:9px; margin-top:2px; letter-spacing:1px; }
  .hpbar-wrap { height:8px; background:#5a5a5a; border-radius:4px; margin-top:3px; overflow:hidden; }
  .hpbar { height:100%; width:100%; background:#4caf50; transition:width .35s, background .35s; }
  .hp-text { font-size:10px; text-align:right; color:#333; margin-top:1px; }
  .status-badge { font-size:9px; padding:0 4px; border-radius:3px; color:#fff; margin-left:4px;}
  .st-brn{background:#e2543b;} .st-par{background:#d4a017;} .st-cnf{background:#9b59b6;}

  #battleUI { position:absolute; left:0; right:0; bottom:0; height:34%; display:flex;
    background:#1b2233; border-top:3px solid #0d1220; }
  #msgBox { flex:1.15; padding:8px 10px; font-size:13px; color:#fff; line-height:1.5;
    display:flex; align-items:center; }
  #msgBox .cursor { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0;} }
  #cmdBox { flex:1; padding:6px; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .cmd { background:#fff; color:#222; border:2px solid #444; border-radius:6px; font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    font-weight:bold; min-height:30px; text-align:center;}
  .cmd:active { background:#ffe27a; }
  .cmd.sel { background:#ffe27a; border-color:#e6a700; box-shadow:0 0 0 2px #ffd34d inset; }
  .cmd.disabled { opacity:.4; }
  .move-type,.type-chip { font-size:9px; padding:1px 5px; border-radius:3px; color:#fff; margin-left:4px;}
  .sub-list { position:absolute; left:0; right:0; bottom:0; height:34%;
    background:#1b2233; border-top:3px solid #0d1220; padding:6px;
    display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .sub-list .cmd { flex-direction:column; gap:1px; padding:2px 4px; }
  .sub-meta { font-size:9px; color:#666; font-weight:normal; }

  /* field dialog */
  #fieldDialog { position:absolute; left:8px; right:8px; bottom:8px; z-index:6;
    background:#fff; color:#222; border:3px solid #33384a; border-radius:10px;
    padding:10px 12px; font-size:13px; line-height:1.55; box-shadow:0 3px 0 #0005; display:none; }
  #fieldDialog.on { display:block; }
  #fieldDialog .who { font-weight:bold; color:#c05a9c; font-size:12px; margin-bottom:2px; }
  #fieldDialog .cursor { animation:blink 1s steps(1) infinite; float:right; }

  /* menu */
  #menuScr { background:rgba(10,14,24,.94); display:none; flex-direction:column; padding:10px 10px 4px; overflow:auto;}
  #menuScr.on { display:flex; }
  #menuScr h3 { text-align:center; margin:4px 0 8px; color:#ffe27a; font-size:15px;}
  .menu-hint { font-size:10px; color:#8ea; text-align:center; margin-bottom:8px;}
  .party-card { display:flex; align-items:center; background:#222a3d;
    border:2px solid #3a4560; border-radius:8px; padding:6px; margin-bottom:7px; gap:8px; cursor:pointer;}
  .party-card.sel { border-color:#ffd34d; box-shadow:0 0 0 2px #ffd34d55; }
  .party-card.fainted { opacity:.55; }
  .party-card img { height:46px; width:auto; image-rendering:auto; background:#0003; border-radius:6px;}
  .pc-info { flex:1; min-width:0;}
  .pc-top { display:flex; justify-content:space-between; font-size:12px; font-weight:bold; }
  .pc-order { display:flex; flex-direction:column; gap:3px; }
  .ord-btn { background:#3a4560; color:#fff; border:none; border-radius:5px; width:30px; height:22px;
    font-size:13px; cursor:pointer; }
  .ord-btn:active{ background:#ffe27a; color:#222;}
  .ord-btn:disabled{ opacity:.3; }
  .pc-types { font-size:9px; margin:2px 0; }
  .mini-hp { height:6px; background:#555; border-radius:3px; overflow:hidden; margin-top:3px;}
  .mini-hp > div { height:100%; background:#4caf50; }
  .pc-stats { font-size:10px; color:#bcd; margin-top:3px; line-height:1.5; }
  #bagArea .bag-item { background:#222a3d; border:2px solid #3a4560; border-radius:8px;
    padding:7px 10px; margin-bottom:6px; font-size:12px; display:flex; justify-content:space-between;}
  .closeBtn { margin:6px auto 4px; }

  /* detail */
  #detailScr { background:rgba(8,11,20,.97); display:none; flex-direction:column; padding:10px; overflow:auto;}
  #detailScr.on { display:flex; }
  .det-head { display:flex; gap:10px; align-items:center; }
  .det-head img { height:80px; image-rendering:auto; background:#0004; border-radius:8px;}
  .det-name { font-size:16px; font-weight:bold; }
  .det-stats { font-size:12px; color:#cde; margin-top:6px; line-height:1.7;}
  .det-bar { height:9px; background:#444; border-radius:4px; overflow:hidden; display:inline-block; width:90px; vertical-align:middle; margin-left:4px;}
  .det-bar>div{ height:100%; background:#67b7f0;}
  .det-moves { margin-top:8px; }
  .det-move { background:#1d2740; border:2px solid #37456a; border-radius:8px; padding:6px 9px; margin-bottom:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;}
  .det-move .mv-meta{ font-size:10px; color:#9ab;}

  /* result */
  #resultScr { background:rgba(8,10,18,.94); display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;}
  #resultScr.on { display:flex; }
  #resultScr h2 { font-size:24px; margin:6px; }
  #resultScr p { font-size:13px; color:#cde; line-height:1.7;}

  /* controls */
  #controls { margin-top:8px; display:flex; justify-content:space-between; align-items:flex-end; gap:8px;}
  #dpad { position:relative; width:132px; height:132px; flex:0 0 auto;}
  .dbtn { position:absolute; width:44px; height:44px; background:#2b3350; color:#fff;
    border:2px solid #46527d; border-radius:8px; font-size:18px; display:flex; align-items:center;
    justify-content:center; user-select:none; cursor:pointer;}
  .dbtn:active { background:#ffe27a; color:#222;}
  #dup{top:0; left:44px;} #ddown{bottom:0;left:44px;} #dleft{left:0;top:44px;} #dright{right:0;top:44px;}
  #rightBtns { flex:1; display:flex; flex-direction:column; gap:8px; align-items:stretch; max-width:160px;}
  .bigBtn { background:#ffe27a; color:#333; border:none; border-radius:10px; padding:11px 14px;
    font-size:14px; font-weight:bold; cursor:pointer; box-shadow:0 3px 0 #b5942f;}
  .bigBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #b5942f;}
  .bigBtn.sec { background:#7fd1a0; box-shadow:0 3px 0 #3f8a63;}
  .bigBtn.a { background:#ff9db0; box-shadow:0 3px 0 #c25f74; font-size:16px;}
  .hint { font-size:10px; color:#8ea; text-align:center; margin-top:6px; line-height:1.5;}
  .flash { animation:flash .35s;} @keyframes flash{0%,100%{filter:none;}50%{filter:brightness(2.3);}}
  .shake { animation:shake .4s;} @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  #playerImg.shake { animation:shake .4s;}
/* Local RPG edition: safe-area-aware play space and separate controls. */
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(ellipse at top,#233248,#10131e 70%)}
#app{max-width:1500px;height:100vh;height:100dvh;min-height:0;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px}
h1{font-size:clamp(11px,1.7vw,16px);margin:0}
#journey{font-size:12px;line-height:1.45;color:#dbe9ff;background:#1c2940;border:1px solid #4b6080;border-radius:8px;padding:5px 10px;min-height:28px}
.screen{height:100%;min-height:0;aspect-ratio:auto;border-radius:14px;box-shadow:0 5px 24px #0006}
#field{touch-action:none}
#controls{margin:0;align-items:center;padding:0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
.dbtn,.bigBtn,.ord-btn,.cmd{touch-action:manipulation;min-height:44px}
.dbtn{touch-action:none}
#app>.hint{display:none}
#menuScr,#detailScr,#resultScr,#titleScr{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#titleScr img{max-height:26%;width:auto;max-width:30%}
#titleScr h2{font-size:clamp(16px,2.3vw,24px)}
#titleScr p{font-size:12px}
#fieldDialog{max-height:70%;overflow:auto;touch-action:pan-y;font-size:clamp(13px,1.7vw,17px)}
#journal{padding:12px;margin-bottom:10px;background:#17243a;border:1px solid #496487;border-radius:10px;font-size:13px;line-height:1.7}
.journal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.journal-actions button{font-size:12px;flex:1;min-width:130px}
#partyArea{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px}
.party-card{margin:0;min-height:110px}.ord-btn{width:44px}.pc-stats{font-size:11px}
.sub-list{height:48%;overflow-y:auto;grid-auto-rows:minmax(44px,1fr);touch-action:pan-y;overscroll-behavior:contain}
#battleUI{height:36%}#msgBox{font-size:clamp(12px,1.6vw,16px);overflow:auto}#cmdBox{min-width:45%;gap:6px}
#enemySlot{width:35%;height:30%}#playerSlot{width:35%;height:32%;bottom:36%}
#enemyImg,#playerImg{max-height:100%;max-width:100%;width:auto}
.info-box{min-width:40%;max-width:49%}#playerInfo{top:40%}
#resultScr{justify-content:flex-start}#resultScr h2{margin-top:18px}
@media (orientation:landscape) and (min-width:600px){
 #app{grid-template-columns:120px minmax(0,1fr) 120px;grid-template-rows:auto auto minmax(0,1fr);gap:5px}
 h1,#journey{grid-column:1/-1}.screen{grid-column:2;grid-row:3}
 #controls{display:contents}#dpad{grid-column:1;grid-row:3;align-self:center;width:114px;height:132px}
 #dup,#ddown{left:35px}#dleft{left:0}#dright{right:0}
 #rightBtns{grid-column:3;grid-row:3;align-self:center;gap:14px;max-width:none}
 #rightBtns .bigBtn{padding:14px 6px;font-size:13px;min-height:58px}
 #titleScr{padding:8px}#titleScr h2{margin:2px;font-size:17px}#titleScr p{font-size:10px}#titleScr .bigBtn{padding:8px 12px;margin-top:5px!important}
}
@media (min-width:1100px) and (min-height:650px){#app{grid-template-columns:150px minmax(0,1fr) 150px}#journey{font-size:15px}.info-name{font-size:17px}.info-lv,.hp-text{font-size:13px}.cmd{font-size:16px}}
@media (orientation:portrait) and (max-height:670px){#dpad{transform:scale(.85);transform-origin:left center;height:114px}#controls{max-height:114px}#journey{font-size:10px}.info-name{font-size:11px}#titleScr p{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app">
  <h1>◆ マキちゃんのモンスターアドベンチャー ◆</h1>
  <div id="journey" aria-live="polite"></div>
  <div class="screen">
    <canvas id="field" width="544" height="416"></canvas>

    <div id="titleScr" class="overlay on">
      <img id="titleImg" alt="マキちゃん">
      <h2>マキちゃんの<br>モンスターアドベンチャー</h2>
      <p>5さいの マキちゃんの はじめての ぼうけん。<br>
      たたかう より、はなしを きく たび。<br>
      7つの町を めぐって、7ひきの なかまと であおう！</p>
      <button class="bigBtn" id="startBtn" style="margin-top:12px;">▶ はじめから</button>
      <a href="classic/" style="color:#cfe;font-size:11px;margin-top:10px">旧版：キョウブツと最初から遊ぶ</a>
    </div>

    <div id="battleScr" class="overlay">
      <div class="info-box" id="enemyInfo"></div>
      <div class="mon-slot" id="enemySlot"><img id="enemyImg" alt="enemy"></div>
      <div class="mon-slot" id="playerSlot"><img id="playerImg" alt="player"></div>
      <div class="info-box" id="playerInfo"></div>
      <div id="battleUI">
        <div id="msgBox"></div>
        <div id="cmdBox"></div>
      </div>
    </div>

    <div id="menuScr" class="overlay">
      <h3>▶ てもち・どうぐ</h3>
      <div class="menu-hint">ポケモンを タップで しょうさい ／ ▲▼で ならびかえ</div>
      <div id="journal"></div>
      <div id="partyArea"></div>
      <div id="bagArea"></div>
      <button class="bigBtn sec closeBtn" id="menuClose">とじる</button>
    </div>

    <div id="detailScr" class="overlay"></div>
    <div id="resultScr" class="overlay"></div>
    <div id="fieldDialog"></div>
  </div>

  <div id="controls">
    <div id="dpad">
      <div class="dbtn" id="dup">▲</div>
      <div class="dbtn" id="ddown">▼</div>
      <div class="dbtn" id="dleft">◀</div>
      <div class="dbtn" id="dright">▶</div>
    </div>
    <div id="rightBtns">
      <button class="bigBtn a" id="aBtn">● けってい / はなす</button>
      <button class="bigBtn" id="menuBtn">≡ メニュー</button>
    </div>
  </div>
  <div class="hint">キーボード: 矢印/WASDで移動（押しっぱなしで連続移動）、Z/Enterで決定・はなす、Escでメニュー</div>
</div>

/* ---------- ステータス・生き物 ---------- */
function calcStat(base, iv, level, isHP){
  if(isHP) return Math.floor((2*base+iv)*level/100)+level+10;
  return Math.floor((2*base+iv)*level/100)+5;
}
function movesForLevel(sp, level){
  if(sp.learnset){ const known=sp.learnset.filter(e=>e.lv<=level).map(e=>e.move);
    const uniq=[]; known.forEach(m=>{ if(!uniq.includes(m)) uniq.push(m); }); return uniq.slice(-4); }
  return (sp.moves||["たいあたり"]).slice(0,4);
}
function makeMon(key, level, ivs){
  const sp=SPECIES[key];
  ivs=ivs||{hp:rnd(31),atk:rnd(31),def:rnd(31),spd:rnd(31)};
  const stats={ hp:calcStat(sp.base.hp,ivs.hp,level,true), atk:calcStat(sp.base.atk,ivs.atk,level),
    def:calcStat(sp.base.def,ivs.def,level), spd:calcStat(sp.base.spd,ivs.spd,level) };
  const mvnames=movesForLevel(sp, level);
  return { key, name:sp.name, img:sp.img, types:sp.types.slice(), level, ivs, stats,
    maxHp:stats.hp, hp:stats.hp, exp:0,
    moves:mvnames.map(m=>({name:m,pp:MOVES[m].pp,maxpp:MOVES[m].pp})),
    status:null, confuse:0, stages:{atk:0,def:0,spd:0} };
}
function stageMult(s){ return s>=0?(2+s)/2:2/(2-s); }
function wildIVs(){ return {hp:randInt(12,31),atk:randInt(12,31),def:randInt(12,31),spd:randInt(12,31)}; }
function recalcStats(mon, levelup){
  const sp=SPECIES[mon.key], iv=mon.ivs, oldMax=mon.maxHp;
  const stats={hp:calcStat(sp.base.hp,iv.hp,mon.level,true),atk:calcStat(sp.base.atk,iv.atk,mon.level),
    def:calcStat(sp.base.def,iv.def,mon.level),spd:calcStat(sp.base.spd,iv.spd,mon.level)};
  mon.stats=stats; mon.maxHp=stats.hp;
  if(levelup) mon.hp=Math.min(mon.maxHp, mon.hp+(stats.hp-oldMax));
  else mon.hp=Math.min(mon.hp, mon.maxHp);
}

  else { B.team.forEach((m,i)=>{ if(spec.team[i].moves){ m.moves=spec.team[i].moves.map(nm=>({name:nm,pp:MOVES[nm].pp,maxpp:MOVES[nm].pp})); } }); }
  B.idx=0; B.isTrainer=(spec.type==="trainer"||spec.type==="boss"); B.isBoss=(spec.type==="boss");
  B.trainer=spec; B.gimmick=spec.gimmick||null; B.storyWin=spec.storyWin||null; B.noLose=!!spec.noLose;

let msgQ=[], msgDone=null;

function nextMsg(){ const box=el("msgBox");
  if(msgQ.length===0){ B.awaiting=null; const d=msgDone; msgDone=null; if(d)d(); return; }
  const line=msgQ.shift();
  box.innerHTML=line+(msgQ.length?' <span class="cursor">▼</span>':'');
  B.awaiting=()=>nextMsg();
}

let CM=null;
function renderMenuItems(container, items, cols, onBack){
  container.innerHTML=""; const objs=[];
  items.forEach((it,i)=>{
    const d=document.createElement("div"); d.className="cmd"+(it.enabled===false?" disabled":"")+(it.cls?" "+it.cls:"");
    d.innerHTML=it.label;
    d.onclick=()=>{ if(it.enabled===false) return; if(!CM||CM.items[i]?.el!==d||B.busy)return; CM.idx=i; highlight(); it.action(); };
    container.appendChild(d); objs.push({el:d,enabled:it.enabled!==false,action:it.action});
  });
  let start=objs.findIndex(o=>o.enabled); if(start<0)start=0;
  CM={items:objs, idx:start, onBack, cols:cols||2}; highlight();
}
function highlight(){ if(!CM)return; CM.items.forEach((o,i)=>o.el.classList.toggle("sel",i===CM.idx)); }
function menuNav(dx,dy){ if(!CM)return; const n=CM.items.length, cols=CM.cols; let i=CM.idx, tries=0;
  do{ if(dy!==0) i=(i+dy*cols+n)%n; if(dx!==0) i=(i+dx+n)%n; tries++; } while(CM.items[i]&&!CM.items[i].enabled&&tries<n*2);
  if(CM.items[i]&&CM.items[i].enabled){ CM.idx=i; highlight(); } }
function menuConfirm(){ if(CM&&CM.items[CM.idx]&&CM.items[CM.idx].enabled) CM.items[CM.idx].action(); }
function menuBack(){ if(CM&&CM.onBack) CM.onBack(); }
function sub(){ let s=el("subList"); if(!s){ s=document.createElement("div"); s.id="subList"; s.className="sub-list"; el("battleScr").appendChild(s);} s.style.display="grid"; return s; }
function hideSub(){ const s=el("subList"); if(s)s.style.display="none"; }

function promptMain(){
  B.busy=false; hideSub(); el("cmdBox").style.display="grid";
  el("msgBox").textContent=`${activeMon().name}　どうする？`;
  const canFlee=!B.isTrainer;
  renderMenuItems(el("cmdBox"),[
    {label:"たたかう", action:showMoves},
    {label:"ポケモン", action:()=>showSwitch(false)},
    {label:"どうぐ", action:showBag},
    {label:canFlee?"にげる":"にげる✕", action:tryRun},
  ],2,null);
}
function showMoves(){
  if(activeMon().moves.every(m=>m.pp<=0)){runTurn({kind:"struggle",side:"player"},enemyAction());return;}
  el("cmdBox").style.display="none"; const me=activeMon();
  const items=me.moves.map((mv,i)=>{ const info=MOVES[mv.name];
    return {label:`<div>${mv.name} <span class="move-type" style="background:${TYPE_COLOR[info.type]}">${info.type}</span></div><div class="sub-meta">威力 ${info.power||"-"} / PP ${mv.pp}/${mv.maxpp}</div>`,
      enabled:mv.pp>0, action:()=>{ hideSub(); doPlayerMove(i); }}; });
  items.push({label:"◀ もどる", action:()=>{ hideSub(); promptMain(); }});
  renderMenuItems(sub(), items, 2, ()=>{ hideSub(); promptMain(); });
}
function showSwitch(forced){
  el("cmdBox").style.display="none"; B.busy=false;
  const items=G.party.map((m,i)=>{ const dead=m.hp<=0, cur=i===B.active;
    return {label:`<div>${m.name} ${cur?"(せんとう)":""}</div><div class="sub-meta">HP ${m.hp}/${m.maxHp} ${m.status?("・"+jStat(m.status)):""}</div>`,
      enabled:!dead&&!cur, action:()=>{ hideSub(); doSwitch(i,forced); }}; });
  if(!forced){ items.push({label:"◀ もどる", action:()=>{ hideSub(); promptMain(); }}); }
  else { el("msgBox").textContent="つぎに どの ポケモンを くりだす？"; }
  renderMenuItems(sub(), items, 2, forced?null:(()=>{ hideSub(); promptMain(); }));
}
function jStat(s){ return s==="brn"?"やけど":s==="par"?"まひ":""; }
function showBag(){
  el("cmdBox").style.display="none";
  const usable=Object.keys(G.bag).filter(n=>(G.bag[n]>0)&&ITEMS[n]&&(ITEMS[n].heal||ITEMS[n].revive||ITEMS[n].reviveAll||ITEMS[n].cure));

function itemTarget(name){
  const it=ITEMS[name];
  if(it.reviveAll){ hideSub(); useItem(name,-1); return; }
  const revive=!!it.revive, cure=!!it.cure;
  const items=G.party.map((m,i)=>{ let ok;
    if(revive) ok=m.hp<=0; else if(cure) ok=!!m.status||m.confuse>0; else ok=(m.hp>0&&m.hp<m.maxHp);
    return {label:`<div>${m.name}</div><div class="sub-meta">HP ${m.hp}/${m.maxHp} ${m.status?("・"+jStat(m.status)):""}</div>`, enabled:ok,
      action:()=>{ hideSub(); useItem(name,i); }}; });
  items.push({label:"◀ もどる", action:()=>{ hideSub(); showBag(); }});
  renderMenuItems(sub(), items, 2, ()=>{ hideSub(); showBag(); });
}

/* ----- 行動 ----- */
function doPlayerMove(i){ runTurn({kind:"move",moveIdx:i,side:"player"}, enemyAction()); }
function doSwitch(i, forced){
  if(forced){ B.active=i; renderSprites(); updateInfo();
    queueMsg([`がんばれ！ ${activeMon().name}！`], ()=>{ if(B._pending){ const f=B._pending; B._pending=null; f(); } else promptMain(); });
    return; }
  runTurn({kind:"switch",idx:i,side:"player"}, enemyAction());
}
function useItem(name,i){ runTurn({kind:"item",itemName:name,idx:i,side:"player"}, enemyAction()); }
function tryRun(){
  if(B.isTrainer){ queueMsg(["しょうぶ からは にげられない！"], promptMain); return; }
  const me=activeMon(), eAct=enemyAction();
  const ch=0.5+(moveSpeed(me)>=moveSpeed(B.enemy)?0.35:0.15);
  if(Math.random()<ch){ queueMsg(["うまく にげきれた！"], ()=>endBattle()); }
  else { B.busy=true; el("cmdBox").style.display="none"; queueMsg(["しかし にげられなかった！"], ()=>resolveAction(eAct,()=>afterTurn(promptMain))); }
}

function enemyAction(){
  const e=B.enemy, me=activeMon();
  const has=nm=>e.moves.findIndex(m=>m.name===nm&&m.pp>0);
  const emit=i=>({kind:"move",moveIdx:i,side:"enemy"});
  const slower=moveSpeed(e)<moveSpeed(me);
  if(B.isBoss && e.hp<e.maxHp*0.32){ const i=has("じこかいふく"); if(i>=0&&Math.random()<0.7) return emit(i); }
  if(slower && me.status!=="par" && me.confuse<=0){ const i=has("でんじは"); if(i>=0&&Math.random()<0.75) return emit(i); }
  if(slower){ const i=has("でんこうせっか"); if(i>=0&&Math.random()<0.5) return emit(i); }
  if(me.stages.atk>-2){ const i=has("あまえる"); if(i>=0&&Math.random()<0.25) return emit(i); }
  let pool=e.moves.map((m,i)=>({m,i})).filter(o=>o.m.pp>0);
  if(!pool.length) return {kind:"struggle",side:"enemy"};
  let best=null,bs=-1;
  for(const o of pool){ const info=MOVES[o.m.name]; let sc;
    if(info.power>0) sc=info.power*typeEff(info.type,me.types)*(0.85+Math.random()*0.4);
    else if(o.m.name==="でんじは") sc=me.status?0:(slower?85:15);
    else if(o.m.name==="あまえる") sc=(me.stages.atk>-2?22:0)*(0.5+Math.random());
    else if(o.m.name==="じこかいふく") sc=e.hp<e.maxHp*0.5?50:0;
    else sc=18*(0.5+Math.random());
    if(sc>bs){bs=sc;best=o;} }
  return emit(best.i);
}
function actPriority(a){ if(a.kind==="switch"||a.kind==="item")return 6;
  if(a.kind==="move"){ const mon=a.side==="player"?activeMon():B.enemy; return MOVES[mon.moves[a.moveIdx].name].priority||0; } return 0; }

function runTurn(pAct,eAct){
  if(B.busy||G.mode!=="battle")return;
  B.busy=true; el("cmdBox").style.display="none"; hideSub(); CM=null;
  let first,second; const pp=actPriority(pAct), ep=actPriority(eAct);
  if(pp!==ep){ [first,second]= pp>ep?[pAct,eAct]:[eAct,pAct]; }
  else { const ps=moveSpeed(activeMon()), es=moveSpeed(B.enemy);
    if(ps===es) [first,second]=Math.random()<0.5?[pAct,eAct]:[eAct,pAct];
    else [first,second]= ps>es?[pAct,eAct]:[eAct,pAct]; }
  resolveAction(first, ()=>{
    if(B.enemy.hp<=0){ onEnemyFaint(); return; }
    if(activeMon().hp<=0){ onPlayerFaint(); return; }
    resolveAction(second, ()=>{
      if(B.enemy.hp<=0){ onEnemyFaint(); return; }
      if(activeMon().hp<=0){ onPlayerFaint(); return; }
      allyTurn(()=>afterTurn(promptMain));
    });
  });
}
function allyTurn(done){
  if(!B.ally || B.ally.hp<=0 || B.enemy.hp<=0){ done(); return; }
  const mv=B.ally.moves[0], info=MOVES[mv.name];
  queueMsg([`${B.allyTrainer}の ${B.ally.name}！ ${mv.name}！`], ()=>{
    const crit=Math.random()<0.1;
    const dmg=calcDmg(B.ally,B.enemy,info.power,info.type,crit);
    B.enemy.hp=Math.max(0,B.enemy.hp-dmg); flashSide("enemy"); updateInfo();
    if(B.enemy.hp<=0){ onEnemyFaint(); } else done();
  });
}
function afterTurn(done){
  const seq=[];
  [{m:B.enemy,who:"enemy"},{m:activeMon(),who:"player"}].forEach(o=>{ const m=o.m; if(m.hp<=0)return;
    if(m.status==="brn"){ const d=Math.max(1,Math.floor(m.maxHp/16)); m.hp=Math.max(0,m.hp-d); seq.push([`${m.name}は やけどの ダメージを うけた！`,o.who]); } });
  if(B.gimmick==="storm" && activeMon().hp>0){ const d=Math.max(1,Math.floor(activeMon().maxHp/12)); activeMon().hp=Math.max(0,activeMon().hp-d); seq.push([`あらしの かぜが ${activeMon().name}を おそう！`,"player"]); }
  if(B.guard>0) B.guard--;
  (function res(i){ if(i>=seq.length){ updateInfo();
      if(B.enemy.hp<=0){ onEnemyFaint(); return; }
      if(activeMon().hp<=0){ onPlayerFaint(); return; }
      B.busy=false; done&&done(); return; }
    queueMsg([seq[i][0]], ()=>{ updateInfo(); flashSide(seq[i][1]); res(i+1); });
  })(0);
}

function resolveAction(act,cb){
  if(!act){ cb(); return; }
  if(act.side==="player" && activeMon().hp<=0 && act.kind==="move"){ cb(); return; }
  if(act.side==="enemy" && B.enemy.hp<=0){ cb(); return; }
  if(act.kind==="switch"){ B.active=act.idx; renderSprites(); updateInfo(); queueMsg([`いけっ！ ${activeMon().name}！`], cb); return; }
  if(act.kind==="item"){ applyItem(act.itemName,act.idx,cb); return; }
  if(act.kind==="struggle"){ const actor=act.side==="player"?activeMon():B.enemy, tgt=act.side==="player"?B.enemy:activeMon();
    queueMsg([`${actor.name}は わるあがきした！`], ()=>{ const d=Math.max(1,Math.floor(tgt.maxHp/6)); tgt.hp=Math.max(0,tgt.hp-d); updateInfo(); flashSide(act.side==="enemy"?"player":"enemy"); cb(); }); return; }
  if(act.kind==="move"){ resolveMove(act,cb); return; }
  cb();
}
function applyItem(name,idx,cb){ const it=ITEMS[name]; G.bag[name]=(G.bag[name]||0)-1;
  if(it.reviveAll){ reviveAll(); updateInfo(); queueMsg([`${name}を つかった。 みんな げんきに なった！`],()=>{updateInfo();cb();}); return; }
  const m=G.party[idx];
  if(it.heal){ const h=Math.min(it.heal, m.maxHp-m.hp); m.hp+=h; queueMsg([`${name}を つかった。 ${m.name}の HPが ${h} かいふく！`], ()=>{ updateInfo(); cb(); }); }
  else if(it.revive){ m.hp=Math.max(1,Math.floor(m.maxHp*it.revive)); m.status=null; m.confuse=0; queueMsg([`${name}を つかった。 ${m.name}が いきを ふきかえした！`], ()=>{ updateInfo(); cb(); }); }
  else if(it.cure){ m.status=null; m.confuse=0; queueMsg([`${name}を つかった。 ${m.name}は げんきに なった！`], ()=>{ updateInfo(); cb(); }); }
  else cb();
}
function resolveMove(act,cb){
  const user=act.side==="player"?activeMon():B.enemy, foe=act.side==="player"?B.enemy:activeMon();
  const mvObj=user.moves[act.moveIdx], mv=MOVES[mvObj.name];
  if(user.status==="par" && Math.random()<0.25){ queueMsg([`${user.name}は からだが しびれて うごけない！`], cb); return; }
  if(user.confuse>0){ user.confuse--;
    if(Math.random()<0.33){ const d=confDmg(user); user.hp=Math.max(0,user.hp-d);
      queueMsg([`${user.name}は こんらんしている…`,`わけも わからず じぶんを こうげきした！`], ()=>{ updateInfo(); flashSide(act.side==="enemy"?"enemy":"player"); cb(); }); return; } }
  mvObj.pp=Math.max(0,mvObj.pp-1);
  const nameLine=`${user.name}の ${mvObj.name}！`;
  if(mv.heal){ queueMsg([nameLine], ()=>{ const h=Math.min(Math.floor(user.maxHp*mv.heal),user.maxHp-user.hp); user.hp+=h; updateInfo(); queueMsg([`${user.name}の HPが かいふくした！`], cb); }); return; }
  if(mv.acc && Math.random()*100>mv.acc){ queueMsg([nameLine,`しかし ${user.name}の こうげきは はずれた！`], cb); return; }
  if(mv.statusMove){ queueMsg([nameLine], ()=>applyStatusMove(mv,user,foe,act,cb)); return; }
  queueMsg([nameLine], ()=>{
    let power=mv.power; if(mv.doubleIfStatus&&foe.status) power*=2;
    const eff=typeEff(mv.type,foe.types);
    if(eff===0){ queueMsg([`しかし ${foe.name}には こうかが ないようだ…`], cb); return; }
    const crit=Math.random()<(mv.highCrit?0.125:0.0625);
    let dmg=calcDmg(user,foe,power,mv.type,crit);
    if(act.side==="enemy" && B.guard>0) dmg=Math.max(1,Math.floor(dmg*0.5));  // ひかりのはどう
    foe.hp=Math.max(0,foe.hp-dmg); flashSide(act.side==="enemy"?"player":"enemy"); updateInfo();
    const extra=[]; if(crit)extra.push("きゅうしょに あたった！");
    if(eff>1)extra.push("こうかは ばつぐんだ！"); else if(eff<1)extra.push("こうかは いまひとつの ようだ…");
    const post=()=>{ if(mv.drain&&dmg>0){ const g=Math.min(Math.floor(dmg*mv.drain),user.maxHp-user.hp);
        if(g>0){ user.hp+=g; updateInfo(); queueMsg([`${foe.name}から すいとった！`], eff2); return; } } eff2(); };
    function eff2(){ if(foe.hp>0&&mv.effect&&mv.echance&&Math.random()<mv.echance) applySecondary(mv,foe,cb); else cb(); }
    if(extra.length) queueMsg(extra, post); else post();
  });
}
function applyStatusMove(mv,user,foe,act,cb){ const e=mv.effect;
  if(e==="partyGuard"){ if(act.side==="player"){ B.guard=mv.turns||3; queueMsg([`${user.name}は ひかりの かべを はった！ しばらく ダメージが はんぶんに なる！`],cb); return; } B.guard=mv.turns||3; queueMsg([`${user.name}は みを まもった！`],cb); return; }
  if(e==="para"){ if(foe.status){ queueMsg(["しかし うまく きまらなかった…"],cb); return; } foe.status="par"; updateInfo(); queueMsg([`${foe.name}は まひして わざが でにくくなった！`],cb); return; }
  if(e==="confuse"){ if(foe.confuse>0){ queueMsg([`${foe.name}は すでに こんらんしている！`],cb); return; } foe.confuse=randInt(2,4); queueMsg([`${foe.name}は こんらんした！`],cb); return; }
  if(e==="defDown")return stage(foe,"def",-(mv.stg||1),cb);
  if(e==="atkDown")return stage(foe,"atk",-(mv.stg||1),cb);
  if(e==="spdDown")return stage(foe,"spd",-(mv.stg||1),cb);
  if(e==="defUpSelf")return stage(user,"def",(mv.stg||1),cb);
  cb();
}
function applySecondary(mv,foe,cb){ const e=mv.effect;
  if(e==="burn"){ if(foe.status||foe.types.includes("ほのお")){cb();return;} foe.status="brn"; updateInfo(); queueMsg([`${foe.name}は やけどを おった！`],cb); return; }
  if(e==="para"){ if(foe.status){cb();return;} foe.status="par"; updateInfo(); queueMsg([`${foe.name}は まひした！`],cb); return; }
  if(e==="defDown")return stage(foe,"def",-(mv.stg||1),cb);
  if(e==="atkDown")return stage(foe,"atk",-(mv.stg||1),cb);
  if(e==="spdDown")return stage(foe,"spd",-(mv.stg||1),cb);
  cb();
}
function stage(mon,st,delta,cb){ const b=mon.stages[st]; mon.stages[st]=Math.max(-6,Math.min(6,b+delta));
  const jn=st==="atk"?"こうげき":st==="def"?"ぼうぎょ":"すばやさ"; let w;
  if(mon.stages[st]===b) w=delta>0?"もう あがらない！":"もう さがらない！";
  else if(delta>0) w=Math.abs(delta)>=2?"ぐーんと あがった！":"あがった！";
  else w=Math.abs(delta)>=2?"がくっと さがった！":"さがった！";
  queueMsg([`${mon.name}の ${jn}が ${w}`],cb);
}
function calcDmg(user,foe,power,mtype,crit){ if(typeEff(mtype,foe.types)===0)return 0; const lv=user.level;
  let atk=user.stats.atk*stageMult(user.stages.atk), def=foe.stats.def*stageMult(foe.stages.def);
  if(crit){ if(user.stages.atk<0)atk=user.stats.atk; if(foe.stages.def>0)def=foe.stats.def; }
  let base=Math.floor(Math.floor((Math.floor(2*lv/5+2)*power*atk/def))/50)+2;
  if(user.types.includes(mtype)) base*=1.5;
  base*=typeEff(mtype,foe.types);
  if(user.status==="brn") base*=0.5;
  if(crit) base*=1.5;
  base*=(85+Math.floor(Math.random()*16))/100;
  return Math.max(1,Math.floor(base));
}
function confDmg(u){ let atk=u.stats.atk*stageMult(u.stages.atk), def=u.stats.def*stageMult(u.stages.def);
  let base=Math.floor(Math.floor((Math.floor(2*u.level/5+2)*40*atk/def))/50)+2; base*=(85+Math.floor(Math.random()*16))/100; return Math.max(1,Math.floor(base)); }

/* ----- 経験値・レベルアップ・進化（バトルのメッセージ列で処理） ----- */
function awardExp(defeated, cb){
  const lead=activeMon(), gain=Math.max(1,Math.floor(defeated.level*(B.isTrainer?8:5)));
  const team=G.party.filter(m=>m.hp>0&&m.level<100); let i=0;
  queueMsg([`みんなで けいけんち！ せんとう ${gain} ／ ひかえ ${Math.ceil(gain/2)}`],function next(){
    if(i>=team.length){cb();return;} const mon=team[i++];levelUpLoop(mon,mon===lead?gain:Math.ceil(gain/2),next);
  });
}
function levelUpLoop(mon, gain, cb){
  mon.exp=(mon.exp||0)+gain;
  (function step(){
    if(mon.level>=100){ cb(); return; }
    const need=mon.level*8;
    if(mon.exp>=need){ mon.exp-=need; mon.level++; recalcStats(mon,true); updateInfo();
      queueMsg([`${mon.name}は レベル ${mon.level}に あがった！`], ()=>{
        checkLearnBattle(mon, ()=>checkEvolveBattle(mon, step)); });
    } else cb();
  })();
}
function checkLearnBattle(mon, cb){
  const sp=SPECIES[mon.key]; if(!sp.learnset){cb();return;}
  const due=sp.learnset.filter(e=>e.lv===mon.level && !mon.moves.some(m=>m.name===e.move));
  (function loop(i){ if(i>=due.length){cb();return;} const mv=due[i].move;
    if(mon.moves.length<4){ mon.moves.push({name:mv,pp:MOVES[mv].pp,maxpp:MOVES[mv].pp}); queueMsg([`${mon.name}は ${mv}を おぼえた！`],()=>loop(i+1)); }
    else { const old=mon.moves.shift().name; mon.moves.push({name:mv,pp:MOVES[mv].pp,maxpp:MOVES[mv].pp}); queueMsg([`${mon.name}は ${old}を わすれて ${mv}を おぼえた！`],()=>loop(i+1)); }
  })(0);
}
function checkEvolveBattle(mon, cb){
  const sp=SPECIES[mon.key];
  if(sp.evolvesTo && mon.level>=sp.evolveLevel){ const to=sp.evolvesTo;
    queueMsg([`おや…？ ${mon.name}の ようすが…！`], ()=>{
      el("playerImg").classList.add("flash");
      mon.key=to; const nsp=SPECIES[to]; mon.name=nsp.name; mon.img=nsp.img; mon.types=nsp.types.slice(); recalcStats(mon,false);
      renderSprites(); updateInfo(); setTimeout(()=>el("playerImg").classList.remove("flash"),450);
      queueMsg([`おめでとう！ ${mon.name}に しんかした！`], ()=>checkLearnBattle(mon, cb));
    });
  } else cb();
}

/* ----- 気絶・勝敗 ----- */
function onEnemyFaint(){ updateInfo(); el("enemyImg").classList.add("flash");
  const fallen=B.enemy;
  queueMsg([`${fallen.name}を たおした！`], ()=>{ el("enemyImg").classList.remove("flash");
    awardExp(fallen, ()=>{
      const nextIdx=B.team.findIndex((m,i)=>i>B.idx && m.hp>0);
      if(B.isTrainer && nextIdx>=0){ B.idx=nextIdx; renderSprites(); updateInfo();
        queueMsg([`${B.trainer.name}は ${B.enemy.name}を くりだした！`], promptMain); return; }
      // 勝利
      const post=(B.trainer&&B.trainer.post)?B.trainer.post:[];
      if(B.isTrainer){ if(!B.isBoss) G.wins++; queueMsg([...post], ()=>winBattle()); return; }
      G.wins++; queueMsg([], ()=>winBattle());
    });
  });
}
function winBattle(){ B.busy=false; setMode("field"); playBGM("field"); const w=B.storyWin; if(w){ B.storyWin=null; hideSub(); CM=null; w(); } else endBattle(); }
function onPlayerFaint(){ B.busy=false; updateInfo();
  queueMsg([`${activeMon().name}は たおれた！`], ()=>{
    if(!G.party.some(m=>m.hp>0)){
      if(B.noLose){ reviveAll(); B.team.forEach(m=>{}); queueMsg(["でも マキちゃんは あきらめない！","なかまたち、もう いちど！"], ()=>{ const s=B.spec; startBattleSpec(s); }); return; }
      gameOver(); return;
    }
    showSwitch(true);
  });
}
function endBattle(){ hideSub(); CM=null; setMode("field"); playBGM("field"); drawField(); }

  const h=TILE*tilesTall, w=h*im.naturalWidth/im.naturalHeight;
  const cx=px+TILE/2-camX, by=py+TILE-camY+3; fx.drawImage(im, cx-w/2, by-h, w, h); }
const OBJ={ T:["t_tree",2.0], B:["t_bush",1.2], R:["t_rock",1.1], H:["t_house_x",2.0],
  h:["t_house",2.0], S:["t_stump",1.0], O:["t_well",1.4], L:["t_logs",1.0] };
const GROUND={ ",":"t_grass", ".":"t_dirt", "W":"t_water", ";":"t_sand", "~":"t_lava", "=":"t_deck", "@":"t_swirl", "G":"t_grass" };

function drawField(){
  updateCamera(); const vw=fcv.width, vh=fcv.height; fx.clearRect(0,0,vw,vh);
  const c0=Math.floor(camX/TILE), r0=Math.floor(camY/TILE);
  const c1=Math.min(MAP_W-1, c0+Math.ceil(vw/TILE)+1), r1=Math.min(MAP_H-1, r0+Math.ceil(vh/TILE)+1);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r), dx=c*TILE-camX, dy=r*TILE-camY;
    let base=GROUND[t]||"t_grass";
    // 木や家の下は草か甲板を敷く
    if(OBJ[t]) base=(G.area==="ship")?"t_deck":"t_grass";
    drawTileImg(base,dx,dy,TILE,TILE);
    if(t==="G"){ const im=img("t_tuft"); if(im.complete&&im.naturalWidth){ const h=TILE*0.95,w=h*im.naturalWidth/im.naturalHeight; fx.drawImage(im, dx+TILE/2-w/2, dy+TILE-h+2, w, h); } }
  }
  const draws=[];
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){ const t=tileAt(c,r);
    if(OBJ[t]){ const [k,th]=OBJ[t]; draws.push({y:(r+1)*TILE, fn:()=>drawObject(k,c,r,th)}); } }
  for(const e of G.entities){ if(e.gone) continue;
    if(e.c<c0-1||e.c>c1+1||e.r<r0-1||e.r>r1+1) continue;
    const th = (e.sprite.includes("dog")||e.sprite.includes("cat"))?1.05:1.7;
    draws.push({y:(e.r+1)*TILE, fn:()=>drawSpriteSheet(e.sprite,e.c,e.c*TILE,e.r*TILE,th)}); }
  draws.push({y:player.py+TILE+1, fn:()=>{ const key=`walk_${player.dir}_${player.frame}`; drawSpriteSheet(key, player.c, player.px, player.py, 1.7); }});
  draws.sort((a,b)=>a.y-b.y); draws.forEach(d=>d.fn());
  if(MAPS[G.area].night){ fx.fillStyle="rgba(12,14,52,0.42)"; fx.fillRect(0,0,vw,vh); }
}

/* ---------- 移動 ---------- */
const held=[]; let interactLock=false, motionEpoch=0;
function pushDir(d){ if(!held.includes(d)) held.push(d); }
function popDir(d){ const i=held.indexOf(d); if(i>=0) held.splice(i,1); if(!held.length) interactLock=false; }
function facingTile(){ let c=player.c,r=player.r; if(player.dir==="up")r--; else if(player.dir==="down")r++; else if(player.dir==="left")c--; else c++; return {c,r}; }
function startStep(dir){
  const epoch=motionEpoch;
  player.dir=dir; let nc=player.c, nr=player.r;
  if(dir==="up")nr--; else if(dir==="down")nr++; else if(dir==="left")nc--; else nc++;
  const ent=entityAt(nc,nr), t=tileAt(nc,nr);
  if((ent||t==="H"||t==="@") && !interactLock){ player.frame=1; drawField(); interact(nc,nr); return; }
  if(isSolidTile(nc,nr)||ent){ player.frame=(player.frame+1)%4; drawField(); return; }
  player.moving=true;
  const sx=player.c*TILE, sy=player.r*TILE, ex=nc*TILE, ey=nr*TILE;
  player.c=nc; player.r=nr; const dur=125; let start=null;
  function step(ts){ if(epoch!==motionEpoch)return; if(!start)start=ts; let p=Math.min(1,(ts-start)/dur);
    player.px=sx+(ex-sx)*p; player.py=sy+(ey-sy)*p; player.frame=p<.5?1:2; drawField();
    if(p<1) requestAnimationFrame(step);
    else { player.px=ex; player.py=ey; player.frame=0; player.moving=false; drawField(); onEnterTile(nc,nr); } }
  requestAnimationFrame(step);
}
function movementLoop(){ requestAnimationFrame(movementLoop);
  if(G.mode!=="field"||player.moving) return;
  if(!held.length){ interactLock=false; return; }
  startStep(held[held.length-1]); }
function onEnterTile(c,r){ if(G.mode!=="field")return; const t=tileAt(c,r);
  if(t==="G"){ const area=MAPS[G.area]; if(area.wild.length && Math.random()<area.rate){
    const w=area.wild[rnd(area.wild.length-1)]; startWild(w.sp, randInt(w.min,w.max)); } } }
function interactFacing(){ if(G.mode!=="field"||player.moving)return; const {c,r}=facingTile(); interact(c,r); }
function interact(c,r){
  const ent=entityAt(c,r), t=tileAt(c,r);
  if(t==="H"){ healParty(); saveGame(); say("かいふくスポット",["ポケモンたちが げんきに なった！","（きろくも ほぞんした）"]); interactLock=true; return; }
  if(t==="@"){ interactLock=true; if(G.area==="ship" && !G.flags.ch7_kyoubutsu){ scene_ch7_kyoubutsu(); } else { say("",["うずしおが ゴウゴウ まわっている。"]); } return; }
  if(!ent) return;
  interactLock=true;
  if(ent.onTalk){ ent.onTalk(); return; }
  if(ent.kind==="npc"){ say(ent.name, ent.dialog()); return; }
  if(ent.defeated){ say(ent.name, ent.postDefeat||["…もう おれの まけだ。"]); return; }
  if(ent.pre){ say(ent.name, ent.pre, ()=>{ ent.startFight&&ent.startFight(); }); return; }
  say(ent.name, ent.dialog?ent.dialog():["…"]);
}

/* ---------- 会話（say） / 選択（ask） ---------- */
let dlgQ=[], dlgWho="", dlgAfter=null, askActive=null;
function say(who, lines, after){ dlgWho=who; dlgQ=(lines||[]).slice(); dlgAfter=after||null; askActive=null; G.mode="dialog"; el("fieldDialog").classList.add("on"); sayNext(); }
function sayNext(){ const box=el("fieldDialog");
  if(!dlgQ.length){ box.classList.remove("on"); const a=dlgAfter; dlgAfter=null; if(a) a(); else { G.mode="field"; drawField(); } return; }
  const line=dlgQ.shift();
  box.innerHTML=(dlgWho?`<div class="who">${dlgWho}</div>`:"")+line+(dlgQ.length?' <span class="cursor">▼</span>':' <span class="cursor">■</span>'); }
function ask(who, question, choices, cont){
  G.mode="dialog"; const box=el("fieldDialog"); box.classList.add("on");
  box.innerHTML=(who?`<div class="who">${who}</div>`:"")+question+`<div id="askc" style="margin-top:6px;"></div>`;
  const wrap=el("askc");
  choices.forEach((c,i)=>{ const b=document.createElement("button"); b.className="bigBtn";
    b.style.cssText="display:block;width:100%;margin:4px 0;font-size:12px;padding:6px 8px;text-align:left;";
    b.textContent="▶ "+c; b.onclick=()=>{ if(!askActive||askActive.wrap!==wrap)return; askActive=null; box.classList.remove("on"); cont(i); }; wrap.appendChild(b); });
  askActive={choices, idx:0, cont, box, wrap};
  askHighlight();
}
function askHighlight(){ if(!askActive)return; [...askActive.wrap.children].forEach((b,i)=>{ b.style.filter=i===askActive.idx?"brightness(1.15)":"none"; b.style.outline=i===askActive.idx?"3px solid #ffd34d":"none"; }); }
function askNav(d){ if(!askActive)return; askActive.idx=(askActive.idx+d+askActive.choices.length)%askActive.choices.length; askHighlight(); }
function askConfirm(){ if(!askActive)return; const i=askActive.idx, c=askActive.cont; askActive.box.classList.remove("on"); askActive=null; c(i); }

/* ---------- シーン・インタプリタ ---------- */
let SC=null;
function runScene(steps, done){ SC={steps:steps.filter(Boolean), i:0, done}; scStep(); }
function scStep(){
  if(!SC) return;
  if(SC.i>=SC.steps.length){ const d=SC.done; SC=null; if(d)d(); else { setMode("field"); drawField(); } if(!SC&&G.mode==="field"){saveGame();updateJourney();} return; }
  const s=SC.steps[SC.i++]; const owner=SC; const cont=()=>{if(SC===owner)scStep();}; const t=s[0];
  switch(t){
    case "say": say(s[1], s[2], cont); break;
    case "think": say("マキちゃん（こころのこえ）", s[1], cont); break;
    case "ask": { const owner=SC; ask(s[1],s[2],s[3],i=>{ if(s[4])s[4](i); if(SC===owner)cont(); }); break; }
    case "give": addItem(s[1], s[2]||1); say("", [`（${s[1]}を ${s[2]||1}こ てにいれた！）`], cont); break;
    case "money": G.money+=s[1]; cont(); break;
    case "join": joinScene(s[1], s[2], cont); break;
    case "heal": healParty(); cont(); break;
    case "flag": G.flags[s[1]]=(s.length>2?s[2]:true); cont(); break;
    case "chapter": G.chapter=s[1]; cont(); break;
    case "news": G.news[s[1]]=s[2]; cont(); break;
    case "kotori": G.kotoriMet[s[1]]=true; cont(); break;
    case "warp": doWarp(s[1],s[2],s[3],()=>{SC=owner;cont();}); break;
    case "battle": s[1].storyWin=cont; startBattleSpec(s[1]); break;
    case "fn": s[1](cont); break;
    case "save": cont(); break; // save only after the scene reaches a safe field checkpoint
    case "rebuild": buildEntities(); drawField(); cont(); break;
    default: cont();
  }
}
function joinScene(key, level, cont){
  if(G.party.some(m=>m.key===key||m.key===SPECIES[key].evolvesTo)){cont();return;}
  if(G.party.length>=7){ say("", [`${SPECIES[key].name}は また こんど なかまに なりたそうだ…`], cont); return; }
  const m=makeLeveled(key, level); G.party.push(m);
  say("", [`🎉 ${m.name}が なかまに なった！`, `${m.name}（Lv${m.level}）が てもちに くわわった！`], cont);
}
function makeLeveled(key, level){
  let m=makeMon(key, level);
  while(SPECIES[m.key].evolvesTo && level>=SPECIES[m.key].evolveLevel){
    m.key=SPECIES[m.key].evolvesTo; const sp=SPECIES[m.key]; m.name=sp.name; m.img=sp.img; m.types=sp.types.slice();
    recalcStats(m,false); m.moves=movesForLevel(sp,level).map(nm=>({name:nm,pp:MOVES[nm].pp,maxpp:MOVES[nm].pp}));
  }
  m.hp=m.maxHp; return m;
}

/* ---------- エリア遷移 ---------- */
function doWarp(area, c, r, cont){
  motionEpoch++; G.area=area; G.chapter=AREA_ORDER.indexOf(area)+1; player.moving=false; setAreaDims(); const st=(c!=null)?{c,r}:MAPS[area].start;
  player.c=st.c; player.r=st.r; player.px=st.c*TILE; player.py=st.r*TILE; player.dir="down"; player.frame=0;
  held.length=0; interactLock=false; buildEntities(); setMode("field"); drawField();
  playBGM("field");
  if(cont){ if(!G.flags["intro_"+area]){ enterArea(area, cont); } else cont(); }
  else if(!G.flags["intro_"+area]){ enterArea(area, null); }
}
function enterArea(area, cont){ G.flags["intro_"+area]=true;
  const fn=AREA_INTRO[area];
  if(fn){ fn(cont); } else if(cont) cont();
}

const SAVE_KEY="maki_monster_save_v1";
function saveGame(){ try{
  const data={ chapter:G.chapter, area:G.area, party:G.party, bag:G.bag, money:G.money, wins:G.wins,
    flags:G.flags, news:G.news, kotoriMet:G.kotoriMet, player:{c:player.c,r:player.r} };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}catch(e){ /* file://等でも落ちないように */ } }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function loadGame(){ try{
  const s=localStorage.getItem(SAVE_KEY); if(!s) return false; const d=JSON.parse(s);
  G.chapter=d.chapter||1; G.area=d.area||"village"; G.party=d.party||[ starterMon() ];
  G.bag=d.bag||{きずぐすり:3}; G.money=d.money||0; G.wins=d.wins||0;
  G.flags=d.flags||{}; G.news=d.news||{}; G.kotoriMet=d.kotoriMet||{};
  setAreaDims(); const p=d.player||MAPS[G.area].start;
  player.c=p.c; player.r=p.r; player.px=p.c*TILE; player.py=p.r*TILE; player.dir="down"; player.frame=0;

/* ============================================================
   入力
   ============================================================ */
const DIRK={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
document.addEventListener("keydown",(e)=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(e.repeat&&!DIRK[k]){e.preventDefault();return;}
  if(G.mode==="title"){ if(k==="Enter"||k===" "||k==="z"){ requestStart(); e.preventDefault(); } return; }
  if(G.mode==="dialog"){
    if(askActive){ if(DIRK[k]){ const d=DIRK[k]; if(d==="up")askNav(-1); else if(d==="down")askNav(1); e.preventDefault(); }
      else if(k==="Enter"||k==="z"||k===" "){ askConfirm(); e.preventDefault(); } return; }
    if(k==="Enter"||k===" "||k==="z"||k==="x"){ sayNext(); e.preventDefault(); } return; }
  if(G.mode==="battle"){
    if(B.awaiting){ if(k==="Enter"||k==="z"||k===" "){ advanceMsg(); e.preventDefault(); } return; }
    if(CM){ if(DIRK[k]){ const d=DIRK[k]; menuNav(d==="left"?-1:d==="right"?1:0, d==="up"?-1:d==="down"?1:0); e.preventDefault(); }
      else if(k==="Enter"||k==="z"||k===" "){ menuConfirm(); e.preventDefault(); }
      else if(k==="Escape"||k==="x"){ menuBack(); e.preventDefault(); } } return; }
  if(G.mode==="menu"){ if(k==="Escape"||k==="x"){ closeMenu(); e.preventDefault(); } return; }
  if(G.mode==="detail"){ if(k==="Escape"||k==="x"){ setMode("menu"); renderMenu(); e.preventDefault(); } return; }
  if(G.mode==="field"){
    if(DIRK[k]){ pushDir(DIRK[k]); e.preventDefault(); }
    else if(k==="Enter"||k==="z"){ interactFacing(); e.preventDefault(); }
    else if(k==="Escape"||k==="x"){ openMenu(); e.preventDefault(); }
  }
});
document.addEventListener("keyup",(e)=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; if(DIRK[k]) popDir(DIRK[k]); });
function bindHold(id,dir){ const b=el(id);
  const dn=(e)=>{ e.preventDefault(); if(G.mode==="field") pushDir(dir); else if(G.mode==="battle"&&CM){ menuNav(dir==="left"?-1:dir==="right"?1:0,dir==="up"?-1:dir==="down"?1:0); } else if(G.mode==="dialog"&&askActive){ if(dir==="up")askNav(-1); else if(dir==="down")askNav(1); } };
  const up=(e)=>{ e&&e.preventDefault(); popDir(dir); };
  b.setAttribute("role","button"); b.setAttribute("aria-label",({up:"上",down:"下",left:"左",right:"右"})[dir]);
  b.addEventListener("pointerdown",e=>{b.setPointerCapture(e.pointerId);dn(e);});
  b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("lostpointercapture",up);
}
bindHold("dup","up"); bindHold("ddown","down"); bindHold("dleft","left"); bindHold("dright","right");
el("aBtn").onclick=()=>{
  if(G.mode==="field") interactFacing();
  else if(G.mode==="dialog"){ if(askActive) askConfirm(); else sayNext(); }
  else if(G.mode==="battle"){ if(B.awaiting) advanceMsg(); else if(CM) menuConfirm(); }
  else if(G.mode==="title") requestStart();
};

function startGame(){ motionEpoch++;SC=null;B.awaiting=null;B.storyWin=null;B._pending=null;CM=null;askActive=null;player.moving=false; G.chapter=1; G.area="village"; G.flags={}; G.news={}; G.kotoriMet={}; G.bag={きずぐすり:3}; G.money=500; G.wins=0;
  initParty(); setAreaDims(); const st=MAPS.village.start;
  player.c=st.c; player.r=st.r; player.px=st.c*TILE; player.py=st.r*TILE; player.dir="down"; player.frame=0;
  held.length=0; interactLock=false; buildEntities(); setMode("field"); playBGM("field"); drawField();
  enterArea("village", null);
}
function continueGame(){ if(loadGame()){ /* ok */ } else startGame(); }
function boot(){ el("titleImg").src=ASSETS["maki_front"]||""; setMode("title");
  // つづきから ボタン
  if(hasSave()){ const b=document.createElement("button"); b.className="bigBtn sec"; b.id="contBtn"; b.style.marginTop="8px"; b.textContent="＞ つづきから"; b.onclick=continueGame;
    el("startBtn").insertAdjacentElement("afterend", b); }
  // BGMトグル
  const bg=document.createElement("button"); bg.className="bigBtn"; bg.id="bgmBtn"; bg.style.cssText="margin-top:8px;font-size:12px;padding:6px 10px;"; bg.textContent=G.bgmOn?"♪ おん":"♪ おふ"; bg.onclick=toggleBGM;
  el("titleScr").appendChild(bg);
  requestAnimationFrame(movementLoop);
}
el("startBtn").onclick=requestStart;
setTimeout(boot,60);
window.addEventListener("load",()=>{ if(G.mode==="field") drawField(); });

/* デバッグ：window.DEBUG.jumpChapter(n) で各章の頭出し */
window.DEBUG={
  jumpChapter(n){
    n=Math.max(1,Math.min(7,n|0));
    const starterLv=[0,5,10,16,24,32,40,46][n];
    G.party=[ makeLeveled("タコット", starterLv) ];
    const joins=[]; // 各章開始時点で手持ちにいるべき仲間
    if(n>=2) joins.push(["メラメラン",Math.max(10,starterLv-2)]);
    if(n>=3) joins.push(["コグモ",Math.max(16,starterLv-2)]);
    if(n>=4) joins.push(["リリッキュ",Math.max(24,starterLv-2)]);
    if(n>=5) joins.push(["マグマント",Math.max(32,starterLv-2)]);
    if(n>=6) joins.push(["ビリチビ",Math.max(38,starterLv-2)]);
    if(n>=7) joins.push(["キョウブツ",45]);
    joins.forEach(([k,l])=>{ if(G.party.length<7) G.party.push(makeLeveled(k,l)); });
    G.chapter=n; G.flags={}; for(let i=1;i<n;i++){ G.flags["ch"+i+"_clear"]=true; G.flags["intro_"+CH_AREA[i]]=true; }
    G.bag={きずぐすり:5,いいきずぐすり:3,げんきのかけら:2}; G.money=2000;
    const area=CH_AREA[n]; G.flags["intro_"+area]=true; doWarp(area, null, null, null);
    healParty();
    console.log("[DEBUG] jumped to chapter",n,"area",area,"party",G.party.map(m=>m.name+" Lv"+m.level));
    return "chapter "+n;
  },
  win(){ if(G.mode==="battle"){ B.team.forEach(m=>m.hp=0); B.idx=B.team.length-1; onEnemyFaint(); } },
  heal(){ healParty(); if(G.mode==="battle")updateInfo(); return "healed"; },
  give(name,n){ addItem(name,n||1); return G.bag; },
  flags(){ return G.flags; },
  save(){ saveGame(); return "saved"; },
};

/* ---------- 共通エンティティ生成 ---------- */
const NEXT_AREA={village:"alumina",alumina:"pikapika",pikapika:"forest",forest:"volcano",volcano:"port",port:"ship"};

function kotoriEntity(area, c, r, firstLines, gift){
  return { kind:"npc", sprite:"c_npc_child_down", c, r, name:"ことり",
    onTalk(){ if(!G.kotoriMet[area]){
      runScene([ ["say","ことり",firstLines], ["give",gift,1], ["kotori",area], ["save"],
        ["say","ことり",["また どこかで あえるといいな！"]] ]);
    } else { runScene([["say","ことり",["まきちゃん、がんばって！","わたしも いつか トレーナーに なるんだ！"]]]); } } };
}
function mamushiEntity(area, c, r, question, choices, headlineForNext, reward){
  return { kind:"npc", sprite:"c_mamushi_down", c, r, name:"きしゃ まむし",
    onTalk(){
      const steps=[];
      if(G.news[area]) steps.push(["say","けいじばん『みんなの冒険新聞』",["＜ぜんかいの ニュース＞",G.news[area]]]);
      if(!G.flags["mamushi_"+area]){
        steps.push(["say","きしゃ まむし",["ぼくは きしゃの まむし。","きょうの ぼうけん、ひとことで いうと なんでしたか？"]]);
        steps.push(["ask","きしゃ まむし","（すきな こたえを えらんでね）",choices]);
        steps.push(["say","きしゃ まむし",["いい ことばだ！ しんぶんに かくよ。","これは とりざいの おれい！"]]);
        steps.push(["give",reward,1]);
        steps.push(["flag","mamushi_"+area]);
        if(NEXT_AREA[area]) steps.push(["news",NEXT_AREA[area],headlineForNext]);
        steps.push(["save"]);
      } else {
        steps.push(["say","きしゃ まむし",["きょうも ぼうけんを おうえん してるよ！"]]);
      }
      runScene(steps);
    } };
}
function signEntity(c, r){
  return { kind:"npc", sprite:"c_npc_grocer_down", c, r, name:"たびの あんないにん",
    onTalk(){
      const visited=AREA_ORDER.filter(a=>G.flags["intro_"+a]&&a!==G.area);
      if(!visited.length){ runScene([["say","たびの あんないにん",["まだ いける ところは ないよ。","この あたりを たんけん してごらん。"]]]); return; }
      const names=visited.map(a=>MAPS[a].name);
      ask("たびの あんないにん","どこへ いく？",names.concat(["やめる"]),(i)=>{
        if(i>=visited.length){ G.mode="field"; drawField(); return; }
        doWarp(visited[i], null, null, null);
      });
    } };
}

let saveNotice="";
const rawSave=saveGame, rawLoad=loadGame;
saveGame=function(){
 if(!G.party.length)return false;
 try{const prev=localStorage.getItem(SAVE_KEY);if(validSave(prev))localStorage.setItem(SAVE_KEY+"_backup",prev);
   const data={chapter:G.chapter,area:G.area,party:G.party,bag:G.bag,money:G.money,wins:G.wins,flags:G.flags,news:G.news,kotoriMet:G.kotoriMet,player:{c:player.c,r:player.r}};
   const value=JSON.stringify(data);localStorage.setItem(SAVE_KEY,value);if(localStorage.getItem(SAVE_KEY)!==value)throw Error("save");
   saveNotice="きろくしました";return true;
 }catch(e){saveNotice="保存できません。ブラウザの保存設定をご確認ください";return false;}
};
function validSave(text){try{const d=JSON.parse(text);return !!(d&&MAPS[d.area]&&Array.isArray(d.party)&&d.party.length>0&&d.party.length<=7&&d.party.every(m=>SPECIES[m.key]&&Number.isFinite(m.level)&&m.level>=1&&m.level<=100&&m.ivs&&["hp","atk","def","spd"].every(k=>Number.isFinite(m.ivs[k]))&&Number.isFinite(m.hp)&&Number.isFinite(m.maxHp)&&m.stats&&Array.isArray(m.moves)&&m.moves.length&&m.moves.every(v=>MOVES[v.name]&&Number.isFinite(v.pp)))&&(!d.player||(Number.isInteger(d.player.c)&&Number.isInteger(d.player.r)&&d.player.r>=0&&d.player.r<MAPS[d.area].map.length&&d.player.c>=0&&d.player.c<MAPS[d.area].map[d.player.r].length)));}catch(e){return false;}}
loadGame=function(){
 try{let text=localStorage.getItem(SAVE_KEY);if(!validSave(text)){const backup=localStorage.getItem(SAVE_KEY+"_backup");if(!validSave(backup))return false;localStorage.setItem(SAVE_KEY,backup);saveNotice="前のきろくから 復元しました";}
   motionEpoch++;SC=null;askActive=null;B.awaiting=null;B.storyWin=null;B._pending=null;player.moving=false;held.length=0;
   if(!rawLoad())return false;G.chapter=AREA_ORDER.indexOf(G.area)+1;
   const next=NEXT_AREA[G.area];if(G.flags["ch"+G.chapter+"_clear"]&&next&&!G.flags["intro_"+next])doWarp(next,null,null,null);
   updateJourney();return true;
 }catch(e){return false;}
};

window.addEventListener("load",()=>{try{if(localStorage.getItem(SAVE_KEY+"_previous_adventure")){const b=document.createElement("button");b.className="bigBtn sec";b.textContent="前の冒険を もどす";b.onclick=()=>{const prev=localStorage.getItem(SAVE_KEY+"_previous_adventure");if(!validSave(prev)){window.alert("前のきろくを読みこめませんでした");return;}if(!window.confirm("前の冒険にもどしますか？ 今のきろくはバックアップします。"))return;const now=localStorage.getItem(SAVE_KEY);if(validSave(now))localStorage.setItem(SAVE_KEY+"_previous_adventure",now);localStorage.setItem(SAVE_KEY,prev);continueGame();};el("titleScr").appendChild(b);}}catch(e){}});

</script>
